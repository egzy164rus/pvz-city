# Сборка и публикация ПВЗ-Сити на GitHub Pages.
# Pages → Source: GitHub Actions. Каждый push в main обновляет живой сайт.
name: Deploy PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # сборка автономного билда: index.html + game.html
      - name: Build
        run: node build.mjs

      - name: Collect site
        run: |
          mkdir -p _site
          cp index.html game.html manifest.webmanifest sw.js favicon.svg .nojekyll _site/
          cp icon-192.png icon-512.png icon-512-maskable.png apple-touch-icon.png _site/
          cp screenshot-day.png screenshot-plan.png _site/ 2>/dev/null || true
          echo "файлов в сборке: $(ls -1 _site | wc -l)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
