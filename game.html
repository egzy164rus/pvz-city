<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#080c17" />
<meta name="description" content="ПВЗ-Сити — симулятор управления пунктом выдачи заказов" />
<title>ПВЗ-Сити — симулятор пункта выдачи</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="icon" href="icon-192.png" sizes="192x192" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ПВЗ-Сити" />
<meta name="color-scheme" content="dark" />
<meta name="format-detection" content="telephone=no" />
<meta property="og:title" content="ПВЗ-Сити — симулятор пункта выдачи" />
<meta property="og:description" content="Управляйте пунктом выдачи заказов: поставки, склад, клиенты, команда, KPI и экономика." />
<meta property="og:image" content="icon-512.png" />
<meta property="og:type" content="website" />
<style>
:root{
  --bg:#070a12; --bg2:#0b1120; --panel:#101828; --panel2:#151f33;
  --line:rgba(255,255,255,.075); --line-strong:rgba(255,255,255,.14);
  --text:#eef2fb; --muted:#8b9ab8;
  --accent:#5b8cff; --accent2:#2f5fe0;
  --good:#3ddc97; --bad:#ff6b6b; --warn:#ffb454;
  --r:18px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; padding:0; min-height:100%}
body{
  background:
    radial-gradient(900px 500px at 15% -10%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%),
    radial-gradient(700px 400px at 100% 0%, #1b2a4a55, transparent 70%),
    var(--bg);
  color:var(--text);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,"Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
button{font:inherit; color:inherit; cursor:pointer}
h1,h2,h3{margin:0 0 6px; line-height:1.2; letter-spacing:-0.01em}
h1{font-size:28px} h2{font-size:21px} h3{font-size:15px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted)}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)} .ok{color:var(--good)}

#app{max-width:1080px; margin:0 auto; padding:0 12px}

/* ---------- кнопки ---------- */
.btn{
  border:1px solid var(--line); background:linear-gradient(180deg,#1a2540,#141d33);
  padding:9px 14px; border-radius:12px; font-weight:600; font-size:14px;
  transition:transform .08s ease, filter .15s ease, border-color .15s;
}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:scale(.97)}
.btn.primary{
  background:linear-gradient(180deg,var(--accent),var(--accent2));
  border-color:transparent; color:#fff; box-shadow:0 8px 24px -8px var(--accent);
}
.btn.big{padding:14px 22px; font-size:16px; border-radius:14px}
.btn.small{padding:6px 10px; font-size:12.5px; border-radius:10px}
.btn.ghost{background:transparent}
.btn:disabled,.btn.dis{opacity:.4; cursor:not-allowed}
.spd{width:38px; height:34px; border-radius:10px; border:1px solid var(--line); background:#131c31; font-size:12px}
.spd.on{background:var(--accent); border-color:transparent; color:#fff; font-weight:700}
.speeds{display:flex; gap:4px}

/* ---------- HUD ---------- */
.hud{
  position:sticky; top:0; z-index:20;
  display:flex; align-items:center; gap:12px; justify-content:space-between;
  padding:10px 12px; margin:0 -12px 10px;
  background:rgba(8,12,23,.86); backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.hud-day{font-weight:800; font-size:15px}
.hud-clock{font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}
.hud-mid{display:flex; gap:16px}
.metric{display:flex; flex-direction:column; line-height:1.15}
.m-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted)}
.m-val{font-weight:700; font-variant-numeric:tabular-nums; font-size:14px}
.hud-right{display:flex; align-items:center; gap:10px}
.lvl{min-width:74px}
.lvl span{font-size:11px; color:var(--muted)}
.lvl .tiny{font-size:9.5px; color:#5d6f92}

/* ---------- карточки ---------- */
.card{
  background:linear-gradient(180deg, rgba(32,46,76,.85), rgba(16,23,40,.94));
  border:1px solid #26354f; border-radius:var(--r);
  margin-bottom:14px;
  box-shadow:0 1px 0 #ffffff0d inset, 0 14px 34px -26px #000;
}
.card.pad{padding:16px}
.card.sel{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent), 0 12px 30px -18px var(--accent)}
.wrap{padding-bottom:96px}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
@media (max-width:820px){ .grid2{grid-template-columns:1fr} .grid3{grid-template-columns:1fr} }

/* ---- компактный HUD на телефоне ---- */
@media (max-width:600px){
  .hud{gap:8px; padding:8px 10px}
  .hud-day{font-size:13px}
  .hud-clock{font-size:11px}
  .hud-mid{gap:10px}
  .m-label{font-size:9px}
  .m-val{font-size:12.5px}
  .hud-mid .metric:nth-child(3){display:none}   /* контракт уезжает в карточку */
  .hud-right{gap:6px}
  .lvl{display:none}
  .spd{width:32px; height:30px; font-size:11px}
  .btn.small{padding:6px 8px; font-size:12px}
  .sticky-cta{padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
  .sticky-cta .muted{display:none}
  .sticky-cta .btn.big{padding:12px 16px; font-size:15px; flex:1}
  .sticky-cta .row{flex:1}
  .wrap{padding-bottom:124px}
  .toast{top:52px; right:8px; font-size:12.5px; padding:7px 11px; max-width:70%}
  .cell{border-radius:8px}
  .cell .cd{font-size:10px}
}
.row{display:flex; gap:8px; align-items:center}
.row-between{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:8px}
.kicker{font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--accent); font-weight:700}
.chips{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px}
.chip{font-size:11px; padding:3px 8px; border-radius:999px; background:#ffffff0f; border:1px solid var(--line); color:var(--muted)}
.bar{height:6px; background:#ffffff12; border-radius:99px; overflow:hidden; margin-top:6px}
.bar.thin{height:4px}
.bar i{display:block; height:100%; width:0%; background:var(--accent); border-radius:99px; transition:width .12s linear}
.bar i.warn{background:var(--warn)} .bar i.danger{background:var(--bad)}
.empty{padding:16px 12px; min-height:0; text-align:center; color:var(--muted); border:1px dashed var(--line); border-radius:12px}
.alert{padding:10px 12px; border-radius:12px; margin-bottom:10px; font-size:13.5px; display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.warnline{background:#f59e0b1f; border:1px solid #f59e0b55; color:#ffd28a}
.busyline{background:color-mix(in srgb, var(--accent) 18%, transparent); border:1px solid color-mix(in srgb, var(--accent) 45%, transparent)}
.busyline .bar{flex:1; min-width:80px; margin:0}

/* ---------- онбординг ---------- */
.start{padding:26px 0 40px}
.logo{display:flex; gap:14px; align-items:center; margin-bottom:16px}
.logo-mark{
  width:54px; height:54px;border-radius:16px; display:grid; place-items:center; font-weight:900; font-size:15px;
  background:linear-gradient(135deg,var(--accent),var(--accent2)); box-shadow:0 10px 30px -10px var(--accent);
}
.lead{color:var(--muted); max-width:620px; margin-bottom:22px}
.sec{margin:22px 0 10px; font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted)}
.brand{position:relative; text-align:left}
.brand-dot{width:26px; height:26px; border-radius:9px; margin-bottom:8px}
.card-title{font-weight:700; font-size:15px; margin-bottom:2px}
.card-sub{font-size:12.5px; color:var(--muted)}
.card[data-act]{text-align:left; width:100%; background:linear-gradient(180deg,#18233c,#111a2c); border:1px solid var(--line); border-radius:var(--r); padding:14px; transition:.15s}
.card[data-act]:hover{transform:translateY(-2px); border-color:#33507e}
.card[data-act].sel{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent), 0 14px 34px -20px var(--accent)}
.card[data-act]:disabled{opacity:.45; cursor:not-allowed}
.lock{font-size:10px; color:var(--warn); border:1px solid #f59e0b55; padding:1px 6px; border-radius:99px}
.start-foot{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:24px; flex-wrap:wrap}

/* ---------- прогноз ---------- */
.day-brief .brief-top{display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:12px}
.brief-nums{display:flex; gap:18px}
.bn{display:flex; flex-direction:column; text-align:right}
.bn b{font-size:19px; font-variant-numeric:tabular-nums}
.bn span{font-size:11px; color:var(--muted)}
.forecast{display:flex; align-items:flex-end; gap:5px; height:96px; padding:8px; background:#0b1222; border-radius:12px; border:1px solid var(--line)}
.fbar{flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; height:100%; gap:4px}
.fbar i{width:100%; border-radius:4px 4px 2px 2px; background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 30%,#0b1222)); min-height:3px}
.fbar span{font-size:9px; color:var(--muted)}
.forecast-legend{margin-top:6px}

/* ---------- таблицы метрик ---------- */
.kpi{display:flex; flex-direction:column; gap:6px; margin-bottom:8px}
.kpi-row{display:grid; grid-template-columns:1fr auto auto; gap:10px; align-items:center; font-size:13.5px; padding:5px 0; border-bottom:1px solid #ffffff08}
.kpi-row b{font-variant-numeric:tabular-nums}

/* ---------- табы ---------- */
.tabs{display:flex; gap:6px; margin-bottom:10px}
.tab{flex:1; padding:10px; border-radius:12px; border:1px solid var(--line); background:#111a2c; font-size:13.5px; font-weight:600; color:var(--muted)}
.tab.on{background:color-mix(in srgb,var(--accent) 22%, #111a2c); color:#fff; border-color:var(--accent)}
.tab-body{min-height:180px}

/* ---------- магазин ---------- */
.shop{display:grid; grid-template-columns:1fr 1fr; gap:8px}
@media (max-width:720px){ .shop{grid-template-columns:1fr} }
.item{display:flex; gap:10px; align-items:center; padding:10px; border:1px solid var(--line); border-radius:12px; background:#0f1729}
.item.locked{opacity:.5}
.item-icon{font-size:20px; width:30px; text-align:center}
.item-main{flex:1; min-width:0}
.item-name{font-weight:600; font-size:13.5px}
.staff-list{display:flex; flex-direction:column; gap:8px}
.staff-item{display:flex; gap:10px; align-items:center; padding:10px; border:1px solid var(--line); border-radius:12px; background:#0f1729}
.staff-item.cand{background:#101c30}
.avatar{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-weight:800;background:color-mix(in srgb,var(--accent) 30%,#16203a)}
.avatar.alt{background:#243352}
.staff-right{display:flex; flex-direction:column; align-items:flex-end; gap:4px}

/* ---------- склад / политики ---------- */
.policy-group{padding:12px 0; border-bottom:1px solid #ffffff08}
.policy-title{font-size:13px; font-weight:700; margin-bottom:8px}
.seg{display:flex; gap:6px; flex-wrap:wrap}
.seg-b{flex:1; min-width:150px; padding:9px; border-radius:10px; border:1px solid var(--line); background:#0f1729; font-size:13px}
.seg-b.on{background:color-mix(in srgb,var(--accent) 25%,#0f1729); border-color:var(--accent)}

/* ---------- день ---------- */
.day-grid{display:grid; gap:12px; grid-template-columns:1.15fr .85fr; grid-template-areas:"a b" "c b"}
.sec-a{grid-area:a} .sec-b{grid-area:b} .sec-c{grid-area:c}
@media (max-width:860px){
  .day-grid{grid-template-columns:1fr; grid-template-areas:"a" "b" "c"}
}
.truck{border-color:color-mix(in srgb, var(--warn) 40%, var(--line)); background:linear-gradient(180deg, color-mix(in srgb, var(--warn) 12%, transparent), rgba(255,255,255,.012))}
.chips.wrap{flex-wrap:wrap}
.pk{
  display:inline-flex; align-items:center; gap:6px;
  padding:8px 10px; border-radius:10px; border:1px solid var(--line); background:#0f1729;
  font-size:12.5px; font-variant-numeric:tabular-nums; font-weight:600;
}
.pk .sz{font-size:9.5px; color:var(--muted); border:1px solid var(--line); border-radius:6px; padding:0 4px}
.pk.sel{border-color:var(--accent); background:color-mix(in srgb,var(--accent) 22%,#0f1729)}
.pk.frag{border-left:3px solid var(--warn)}

.shelf{margin-bottom:10px}
.shelf-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px}
.zone-tag{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; padding:2px 7px; border-radius:99px; background:#ffffff10; color:var(--muted)}
.z-std{color:#93c5fd} .z-frag{color:#fcd34d} .z-kgt{color:#c4b5fd}
.cells{display:grid; grid-template-columns:repeat(8,1fr); gap:5px}
@media (max-width:560px){ .cells{grid-template-columns:repeat(6,1fr); gap:6px} }
@media (max-width:380px){ .cells{grid-template-columns:repeat(5,1fr)} }
.cell{
  position:relative; aspect-ratio:1; border-radius:10px; border:1px solid var(--line);
  background:#0d1526; display:flex; align-items:center; justify-content:center;
  font-size:12px; font-variant-numeric:tabular-nums; color:#5f7093; padding:0; overflow:hidden;
}
.cell.empty{color:#31415f; background:#0b1322; border-style:dashed; border-color:#1b2740}
.cell.full{background:linear-gradient(180deg,#22314f,#182541); border-color:#3a5080; color:#eaf1ff; font-weight:700; box-shadow:inset 0 -2px 0 #ffffff08}
.cell .cd{font-weight:700; font-size:11px; line-height:1}
.cell .cl{font-size:8.5px; color:var(--muted); line-height:1}
.cell.frag{box-shadow:inset 0 0 0 1px #f59e0b55}
.cell .urg{position:absolute; top:2px; right:3px; font-size:9px; color:var(--warn); font-weight:800}
.cell.match{
  border-color:var(--good); background:linear-gradient(180deg,#14432a,#0f2f1f);
  animation:pulse 1s infinite;
}
.cell.target{border-color:var(--accent); border-style:dashed; background:color-mix(in srgb,var(--accent) 12%,#0d1526)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #22c55e66}50%{box-shadow:0 0 0 4px #22c55e22}}

.queue{display:flex; flex-direction:column; gap:7px}
.client{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  padding:9px 11px; border-radius:12px; border:1px solid var(--line); background:#0f1729;
}
.client.sel{border-color:var(--accent); background:color-mix(in srgb,var(--accent) 18%,#0f1729)}
.client.hurry{border-left:3px solid var(--warn)}
.client.scandal{border-left:3px solid var(--bad)}
.client.consult{border-left:3px solid #64748b}
.cl-main{flex:1; min-width:0}
.cl-code{font-weight:700; font-variant-numeric:tabular-nums; display:flex; gap:6px; align-items:center}
.cl-act{font-size:11px; color:var(--muted); white-space:nowrap}
.tag{font-size:9.5px; padding:1px 6px; border-radius:99px; background:#f59e0b2a; color:#fcd34d}
.tag.bad{background:#ef44442a; color:#fca5a5}

.logcard{max-height:260px; overflow:auto}
.log{display:flex; flex-direction:column; gap:5px; font-size:12.5px}
.logline{display:flex; gap:8px; color:#c7d3ea; line-height:1.35}
.logline .lt{color:#4b5c7d; font-variant-numeric:tabular-nums; font-size:11px; min-width:34px}
.logline.bad{color:#fca5a5} .logline.good{color:#86efac} .logline.warn{color:#fcd34d}
.logline.truck{color:#93c5fd} .logline.lvl{color:#c4b5fd}

/* ---------- отчёт ---------- */
.report-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:12px 0}
.rn{background:#0f1729; border:1px solid var(--line); border-radius:12px; padding:10px; text-align:center}
.rn b{display:block; font-size:18px; font-variant-numeric:tabular-nums}
.rn span{font-size:11px; color:var(--muted)}
.pnl{display:flex; flex-direction:column; gap:4px; margin:10px 0 12px}
.pnl-row{display:flex; justify-content:space-between; font-size:13.5px; padding:5px 0; border-bottom:1px solid #ffffff08}
.pnl-row.total{border-bottom:none; border-top:1px solid var(--line); margin-top:6px; padding-top:10px; font-size:15px}
.gameover{border-color:#ef444455}

/* ---------- sticky CTA ---------- */
.sticky-cta{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  display:flex; justify-content:space-between; align-items:center; gap:12px;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  background:rgba(8,12,23,.92); backdrop-filter:blur(16px); border-top:1px solid var(--line);
  max-width:1080px; margin:0 auto;
}
.sticky-cta .muted{max-width:60%}
@media (max-width:600px){ .sticky-cta .muted{display:none} }

/* ---------- тост и модалка ---------- */
.toast{
  position:fixed; right:12px; top:56px; transform:none; pointer-events:none;
  padding:10px 16px; border-radius:12px; font-size:13.5px; font-weight:600; z-index:60;
  background:#1b2438; border:1px solid var(--line); box-shadow:0 16px 40px -16px #000;
  animation:pop .18s ease;
}
.toast.bad{border-color:#ef444488; color:#fca5a5}
.toast.good{border-color:#22c55e88; color:#86efac}
@keyframes pop{from{opacity:0; transform:translateY(-6px)}to{opacity:1; transform:translateY(0)}}
.modal-bg{position:fixed; inset:0; background:#04060c99; backdrop-filter:blur(3px); display:grid; place-items:center; z-index:70; padding:16px}
.modal{
  width:100%; max-width:440px; background:linear-gradient(180deg,#1a2440,#111a2c);
  border:1px solid var(--line); border-radius:18px; padding:20px; box-shadow:0 30px 80px -30px #000;
  animation:pop2 .18s ease;
}
@keyframes pop2{from{opacity:0; transform:scale(.96)}to{opacity:1; transform:scale(1)}}
.opts{display:flex; flex-direction:column; gap:8px; margin:14px 0 10px}
.opt{text-align:left; padding:12px; background:#0f1729}
.opt:hover{border-color:var(--accent)}

.help p{font-size:13.5px; color:#c7d3ea; margin:0 0 10px; line-height:1.5}
.help b{color:#fff}

.boot{padding:40px 24px; text-align:center; color:var(--muted); font-size:15px}

.muted.tiny,.tiny{font-size:10.5px; color:#5d6f92}
.staff-right .btn{white-space:nowrap}

.cell.full::after{content:''; position:absolute; bottom:4px; width:4px; height:4px; border-radius:50%; background:#7ea6ea}
.cell.located{
  border-color:#f59e0b; border-width:2px; background:#3a2a0e; color:#ffe6b0; font-weight:800;
  animation:locpulse 1.1s infinite;
}
@keyframes locpulse{0%,100%{box-shadow:0 0 0 0 #f59e0b88}50%{box-shadow:0 0 0 6px #f59e0b00}}

.client{padding:9px 10px; gap:8px}
.cl-tap{flex:1; min-width:0; background:transparent; border:0; text-align:left; padding:0; color:inherit; display:block}
.cl-tap.static{cursor:default}
.client.ready{border-color:var(--good); box-shadow:0 0 0 1px #22c55e66}
.cl-addr{font-size:11.5px; color:#fcd34d; margin-top:4px; font-weight:600}
.cl-addr.bad{color:#fca5a5}
.handsline{background:#f59e0b1f; border:1px solid #f59e0b66; color:#ffd28a}

/* ---------- редактор планировки ---------- */
.room{
  --cols:9; --rows:7;
  position:relative; margin:10px auto 6px; width:100%; max-width:min(100%, 600px);
  border:1px solid var(--line); border-radius:16px; padding:8px;
  background:
    radial-gradient(circle at 1px 1px, rgba(255,255,255,.055) 1px, transparent 0) 0 0/16px 16px,
    linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,0));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
}
.room-bg{display:grid; grid-template-columns:repeat(var(--cols),1fr); gap:4px}
.rcell{
  aspect-ratio:1; min-height:28px; border-radius:9px; padding:0;
  border:1px solid rgba(255,255,255,.07); background:rgba(255,255,255,.035);
  transition:background .12s, border-color .12s;
}
.rcell:hover{border-color:color-mix(in srgb,var(--accent) 70%, transparent); background:color-mix(in srgb,var(--accent) 14%, transparent)}
.room-fix{
  position:absolute; inset:8px; display:grid;
  grid-template-columns:repeat(var(--cols),1fr); grid-template-rows:repeat(var(--rows),1fr);
  gap:4px; pointer-events:none;
}
.rfix{
  position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  border-radius:10px; pointer-events:auto; overflow:hidden; padding:3px;
  background:linear-gradient(180deg, color-mix(in srgb,#3b5b95 70%, #141d2f), #182543);
  border:1px solid rgba(255,255,255,.16); color:#dbe7ff;
  box-shadow:0 1px 0 rgba(255,255,255,.12) inset, 0 6px 14px -10px #000;
  font-size:10.5px; font-weight:650; letter-spacing:-0.01em;
}
.rfix.is-counter{
  background:linear-gradient(180deg, color-mix(in srgb, var(--good) 42%, #14251c), #10251a);
  border-color:color-mix(in srgb, var(--good) 45%, transparent); color:#eafff3;
}
.rfix.is-shelf{
  background:linear-gradient(180deg, color-mix(in srgb, var(--warn) 34%, #241d0d), #20190c);
  border-color:color-mix(in srgb, var(--warn) 40%, transparent); color:#ffeecb;
}
.rfix-ico{display:grid; place-items:center; opacity:.95}
.rfix-name{font-size:9.5px; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; opacity:.9}
.rfix.sm .rfix-name{display:none}
.rfix.sm .rfix-ico .i{width:18px; height:18px}
.rfix-dist{position:absolute; top:3px; left:4px; font-size:9px; color:#ffd479; font-weight:800; opacity:.9}
.rfix-x{
  position:absolute; top:0; right:0; width:18px; height:18px; border:0; padding:0;
  background:rgba(0,0,0,.35); color:#cfe0ff; border-radius:0 9px 0 8px;
  display:grid; place-items:center; opacity:0; transition:opacity .12s;
}
.rfix-x .i{width:11px; height:11px}
.rfix:hover .rfix-x, .rfix.moving .rfix-x{opacity:1}
@media (hover:none){ .rfix-x{opacity:.75} }
.palette{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px}
.pal{
  display:flex; align-items:center; gap:9px; padding:9px 12px; border-radius:12px;
  border:1px solid var(--line-strong); background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
  font-size:13px; font-weight:600; min-height:44px; color:var(--text);
}
.pal:hover{border-color:rgba(255,255,255,.24)}
.pal.sel{
  border-color:color-mix(in srgb,var(--accent) 70%, transparent);
  background:linear-gradient(180deg, color-mix(in srgb,var(--accent) 26%, transparent), color-mix(in srgb,var(--accent) 8%, transparent));
  box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 45%, transparent) inset;
}
.pal em{font-style:normal; color:var(--muted); font-size:11px; font-weight:600}
.pal-ico{
  width:28px; height:28px; border-radius:9px; display:grid; place-items:center;
  background:rgba(255,255,255,.06); border:1px solid var(--line); color:color-mix(in srgb, var(--accent) 60%, #fff);
}

.rfix.moving{outline:2px solid var(--accent); box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%, transparent)}

/* ---------- мини-карта зала ---------- */
.minimap .mm-room{
  display:grid; gap:2px; width:100%; max-width:360px; margin:8px auto 2px;
  background:#0d1729; border-radius:10px; padding:6px; border:1px solid var(--line);
  background-image:radial-gradient(circle, #1e2d49 1.1px, transparent 1.2px);
  background-size:14px 14px; background-position:4px 4px;
}
.mm-fix{border-radius:3px; position:relative; overflow:hidden; min-height:6px}
.mm-fix.counter{background:#1d7a44; border:1px solid #34d399}
.mm-fix.shelf{background:#5a4517; border:1px solid #fbbf24cc}
.mm-fix.fitting{background:#1e40af; border:1px solid #93c5fd}
.mm-fix.plain{background:#2b4570; border:1px solid #5b7fb8}
.mm-fill{position:absolute; left:0; right:0; bottom:0; background:#f59e0b55}
.mm-target{
  border-radius:3px; border:2px solid #fbbf24; background:#fbbf2433;
  animation:mmPulse 1.1s ease-in-out infinite;
}
@keyframes mmPulse{50%{background:#fbbf2466}}
.mm-token{
  display:flex; align-items:center; justify-content:center;
  font-size:15px; line-height:1; filter:drop-shadow(0 0 3px #000);
  transition:none; z-index:2;
}
.mm-token.carry{font-size:17px}
.mm-token.staff{font-size:12px; opacity:.92}
.mm-token.staff::after{content:'';}

/* оболочка-регион: не влияет на раскладку, но позволяет патчить участки */
.shell{display:contents}

/* плавность: анимации не перезапускаются, потому что DOM больше не пересобирается */
.card{transition:border-color .18s ease, background .18s ease, box-shadow .18s ease}
.btn{transition:transform .08s ease, background .16s ease, border-color .16s ease, opacity .16s ease}
.btn:active{transform:translateY(1px) scale(.995)}
.bar i{transition:width .45s linear}
.cl-tap{transition:background .15s ease; border-radius:10px}
.cl-tap:hover{background:#ffffff08}
@media (prefers-reduced-motion: reduce){ .bar i{transition:none} }

/* ---------- панель текущего дела ---------- */
.actionbar{
  position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(64px + env(safe-area-inset-bottom));
  width:min(720px, calc(100% - 20px)); z-index:31;
  display:flex; align-items:center; gap:12px;
  padding:10px 12px; border-radius:14px;
  background:linear-gradient(180deg,#16233c,#101a2e);
  border:1px solid color-mix(in srgb, var(--accent) 45%, #24334f);
  box-shadow:0 10px 30px #00000080, 0 0 0 1px #00000040 inset;
  animation:abIn .18s ease-out;
}
@keyframes abIn{from{opacity:0; transform:translate(-50%, 8px)} to{opacity:1; transform:translate(-50%,0)}}
.actionbar .ab-main{flex:1; min-width:0}
.actionbar .ab-title{font-weight:700; font-size:13px; line-height:1.25; margin-bottom:4px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.actionbar .ab-time{font-variant-numeric:tabular-nums; font-weight:700; color:var(--accent); font-size:13px; min-width:52px; text-align:center}
.actionbar .btn{flex-shrink:0}
@media (max-width:820px){ .actionbar{bottom:calc(78px + env(safe-area-inset-bottom)); width:calc(100% - 16px)} }

.wrap.day.with-bar{padding-bottom:200px}
@media (max-width:820px){ .wrap.day.with-bar{padding-bottom:220px} }
/* журнал не растягивает страницу */
.logcard .log{max-height:170px; overflow-y:auto; scrollbar-width:thin}

/* ============================================================
   ПРЕМИАЛЬНАЯ ТЕМА
   ============================================================ */

/* ---- иконки ---- */
.i{width:1em; height:1em; display:inline-block; vertical-align:-0.14em; flex-shrink:0}
h3 .i{width:15px; height:15px; vertical-align:-2px; margin-right:6px; opacity:.75}
.m-label .i{width:12px; height:12px; vertical-align:-2px; margin-right:4px; opacity:.8}
.btn .i{width:17px; height:17px}
.btn.big .i{width:18px; height:18px}
.btn.small .i{width:15px; height:15px}
.ico-inline{display:inline-flex; align-items:center; gap:3px}
.ico-inline .i{width:12px; height:12px; opacity:.7}
.iconbtn{padding:8px; line-height:0; border-radius:12px}
.iconbtn .i{color:var(--muted)}
.iconbtn:hover .i{color:var(--text)}
.spd .i{width:14px; height:14px; vertical-align:-3px}
.tab .i{width:15px; height:15px}
.item-icon .i{width:21px; height:21px}
.pal-ico .i{width:16px; height:16px}
.rfix-ico .i{width:15px; height:15px}
.mm-token .i{width:13px; height:13px}
.mm-legend{display:inline-flex; align-items:center; gap:5px; margin-left:8px; color:var(--muted); font-size:11px}
.mm-legend .i{width:13px; height:13px}
.av-role{position:absolute; right:-3px; bottom:-3px; width:16px; height:16px; border-radius:50%;
  background:#0d1524; border:1px solid var(--line-strong); display:grid; place-items:center}
.av-role .i{width:10px; height:10px; color:var(--accent)}

/* ---- фон ---- */
html{background:#070a12}
body{
  background:#070a12;
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,"Helvetica Neue",Arial,sans-serif;
  letter-spacing:-0.005em;
}
body::before{
  content:''; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(1100px 620px at 8% -12%, color-mix(in srgb, var(--accent) 26%, transparent), transparent 62%),
    radial-gradient(900px 520px at 96% -4%, #2b1d5f66, transparent 64%),
    radial-gradient(1000px 700px at 50% 118%, #0a1a3355, transparent 70%),
    linear-gradient(180deg, #080c15, #060911 60%, #05080f);
}
h1{font-size:30px; letter-spacing:-0.03em; font-weight:800}
h2{font-size:22px; letter-spacing:-0.02em; font-weight:750}
h3{font-size:12px; text-transform:uppercase; letter-spacing:.1em; color:#93a3c0; font-weight:700}
.m-val,.rn b{font-variant-numeric:tabular-nums; letter-spacing:-0.02em}

/* ---- поверхности ---- */
.card{
  background:linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.012));
  border:1px solid var(--line);
  border-radius:var(--r);
  box-shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 20px 44px -32px #000, 0 2px 6px -3px #0009;
}
.card.pad{padding:16px}
@media (min-width:821px){ .card.pad{padding:18px} }
.card[data-act]{
  background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.015));
  border:1px solid var(--line); border-radius:var(--r);
}
.card[data-act]:hover{border-color:var(--line-strong); transform:translateY(-2px); box-shadow:0 26px 50px -34px #000}
.card[data-act].sel{border-color:color-mix(in srgb, var(--accent) 70%, transparent);
  box-shadow:0 0 0 1px color-mix(in srgb, var(--accent) 55%, transparent), 0 22px 48px -28px color-mix(in srgb, var(--accent) 70%, transparent)}

/* ---- кнопки ---- */
.btn{
  background:linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.035));
  border:1px solid var(--line-strong);
  border-radius:13px; font-weight:650; letter-spacing:-0.01em;
  box-shadow:0 1px 0 rgba(255,255,255,.08) inset, 0 8px 20px -16px #000;
  min-height:38px;
}
.btn:hover{filter:brightness(1.1); border-color:rgba(255,255,255,.22)}
.btn.primary{
  background:linear-gradient(180deg, color-mix(in srgb, var(--accent) 92%, #fff), var(--accent2));
  border-color:transparent; color:#fff;
  box-shadow:0 1px 0 rgba(255,255,255,.35) inset, 0 12px 26px -12px color-mix(in srgb, var(--accent) 90%, transparent);
}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:rgba(255,255,255,.02); border-color:var(--line)}
.btn.big{min-height:48px; border-radius:15px; font-size:15.5px; font-weight:700; letter-spacing:-0.015em}
.btn.small{min-height:32px; border-radius:10px; font-size:12.5px}
.btn:focus-visible,.tab:focus-visible,.spd:focus-visible{outline:2px solid color-mix(in srgb, var(--accent) 80%, transparent); outline-offset:2px}

/* ---- HUD ---- */
.hud{
  background:linear-gradient(180deg, rgba(10,15,26,.86), rgba(10,15,26,.62));
  backdrop-filter:blur(22px) saturate(140%);
  border-bottom:1px solid var(--line);
}
.m-label{font-size:9.5px; letter-spacing:.13em; font-weight:700; display:inline-flex; align-items:center}
.m-val{font-size:15px; font-weight:750}

/* ---- вкладки ---- */
.tabs{display:flex; gap:6px; padding:5px; border-radius:16px;
  background:rgba(255,255,255,.035); border:1px solid var(--line); margin:2px 0 14px}
.tab{
  flex:1; display:inline-flex; align-items:center; justify-content:center; gap:7px;
  padding:10px 8px; border-radius:12px; border:1px solid transparent; background:transparent;
  color:var(--muted); font-weight:650; font-size:13.5px; letter-spacing:-0.01em; min-height:42px;
  transition:color .15s, background .15s, box-shadow .15s;
}
.tab:hover{color:var(--text); background:rgba(255,255,255,.04)}
.tab.on{color:#fff; background:linear-gradient(180deg, color-mix(in srgb, var(--accent) 34%, transparent), color-mix(in srgb, var(--accent) 12%, transparent));
  border-color:color-mix(in srgb, var(--accent) 45%, transparent);
  box-shadow:0 1px 0 rgba(255,255,255,.12) inset, 0 10px 24px -18px var(--accent)}
.tab-badge{display:inline-grid; place-items:center; min-width:17px; height:17px; padding:0 5px; margin-left:5px;
  border-radius:99px; background:var(--warn); color:#1a1206; font-size:10.5px; font-weight:800}

/* ---- магазин ---- */
.item{padding:12px; border-radius:14px; border:1px solid transparent; transition:background .15s, border-color .15s}
.item:hover{background:rgba(255,255,255,.035); border-color:var(--line)}
.item-icon{
  width:44px; height:44px; border-radius:13px; display:grid; place-items:center; flex-shrink:0;
  background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
  border:1px solid var(--line-strong); color:color-mix(in srgb, var(--accent) 65%, #fff);
}
.item-name{font-weight:700; letter-spacing:-0.01em}
.item.locked .item-icon{opacity:.45}
.item.locked .item-name{color:var(--muted)}

/* ---- аватары ---- */
.avatar{position:relative; width:40px; height:40px; border-radius:50%; display:grid; place-items:center;
  font-weight:800; font-size:15px; background:linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.04));
  border:1px solid var(--line-strong); color:#dbe6ff}
.avatar.alt{background:linear-gradient(180deg, color-mix(in srgb, var(--accent) 30%, transparent), rgba(255,255,255,.03))}

/* ---- ячейки склада ---- */
.cell{background:rgba(255,255,255,.022); border:1px solid var(--line); color:#64749a}
.cell.full{background:linear-gradient(180deg, rgba(255,255,255,.1), rgba(255,255,255,.03));
  border-color:var(--line-strong); color:#eaf1ff;
  box-shadow:inset 0 -2px 0 rgba(255,255,255,.05), 0 4px 12px -8px #000}
.cell.located{border-color:var(--warn); background:color-mix(in srgb, var(--warn) 22%, #10161f); color:#ffe6b0}

/* ---- нижние панели ---- */
.sticky-cta{
  background:linear-gradient(180deg, rgba(6,9,16,.72), rgba(6,9,16,.94));
  backdrop-filter:blur(22px) saturate(140%);
  border-top:1px solid var(--line);
}
.actionbar{
  background:linear-gradient(180deg, rgba(24,34,54,.96), rgba(13,20,34,.98));
  border:1px solid color-mix(in srgb, var(--accent) 42%, var(--line-strong));
  border-radius:16px;
  box-shadow:0 18px 44px -22px #000, 0 1px 0 rgba(255,255,255,.1) inset;
}
.actionbar .ab-title{display:flex; align-items:center; gap:7px; font-size:13.5px; font-weight:700}
.actionbar .ab-title .i{color:var(--warn); width:15px; height:15px}
.actionbar .btn.primary{min-height:42px; padding-inline:18px}

/* ---- прочее ---- */
.bar{height:6px; border-radius:99px; background:rgba(255,255,255,.07); overflow:hidden}
.bar.thin{height:4px}
.bar i{display:block; height:100%; border-radius:99px; background:linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 55%, #fff))}
.bar i.warn{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
.bar i.danger{background:linear-gradient(90deg,#ef4444,#fb7185)}
.chip{background:rgba(255,255,255,.05); border:1px solid var(--line); border-radius:99px; padding:4px 9px; font-size:11.5px}
.kpi-row{padding:9px 0; border-bottom:1px solid rgba(255,255,255,.05)}
.kpi-row:last-child{border-bottom:0}
.toast{
  background:linear-gradient(180deg, rgba(26,36,56,.98), rgba(16,23,38,.98));
  border:1px solid var(--line-strong); border-radius:13px;
  box-shadow:0 16px 34px -20px #000;
}
.staff-item, .pk{transition:border-color .15s, background .15s}
@media (hover:hover){ .pk:hover{border-color:color-mix(in srgb, var(--accent) 50%, transparent)} }

/* ---- лента: точка статуса вместо эмодзи ---- */
.logline{position:relative; padding-left:14px; line-height:1.5}
.logline::before{
  content:''; position:absolute; left:0; top:.55em; width:5px; height:5px; border-radius:50%;
  background:#41557a;
}
.logline.good::before{background:var(--good)}
.logline.bad::before{background:var(--bad)}
.logline.warn::before{background:var(--warn)}
.logline.truck::before{background:var(--accent)}
.logline.lvl::before{background:#a78bfa}
.logline.event::before{background:#f472b6}
.logline .lt{opacity:.55}

/* ---- витрина франшиз ---- */
.brand-tile{
  width:46px; height:46px; border-radius:15px; display:grid; place-items:center;
  font-size:19px; font-weight:800; color:#fff; letter-spacing:-0.02em;
  background:linear-gradient(150deg, var(--b), var(--b2, var(--b)));
  box-shadow:0 1px 0 rgba(255,255,255,.4) inset, 0 14px 28px -16px var(--b), 0 2px 8px -4px #000a;
  margin-bottom:10px;
}
.card[data-act].sel .brand-tile{box-shadow:0 1px 0 rgba(255,255,255,.5) inset, 0 16px 34px -14px var(--b)}
.ico-lead{display:flex; align-items:center; gap:8px}
.ico-lead > .i{width:17px; height:17px; opacity:.8}
.card[data-act] .card-title .i{color:var(--muted)}

/* ---- прогноз потока ---- */
.forecast{gap:6px}
.fbar{position:relative; border-radius:8px; overflow:hidden; background:rgba(255,255,255,.03)}
.fbar i{background:linear-gradient(180deg, color-mix(in srgb, var(--accent) 88%, #fff), var(--accent2));
  border-radius:7px; box-shadow:0 0 0 1px rgba(255,255,255,.08) inset}
.fbar span{color:var(--muted); font-size:10.5px; font-variant-numeric:tabular-nums}

/* ---- иконка-лид в заголовках строк ---- */
b.ico-lead{display:inline-flex; align-items:center; gap:7px}
b.ico-lead > .i{width:18px; height:18px; opacity:.85; color:var(--warn)}

/* ---- тост: снизу по центру, над панелью действий ---- */
.toast{
  top:auto; right:auto; left:50%; transform:translateX(-50%);
  bottom:calc(136px + env(safe-area-inset-bottom));
  pointer-events:none; max-width:calc(100vw - 32px);
  text-align:center; border-radius:99px; padding:10px 18px; font-size:13px; font-weight:600;
  animation:popUp .2s ease;
}
@keyframes popUp{from{opacity:0; transform:translate(-50%,10px)}to{opacity:1; transform:translate(-50%,0)}}

/* ---- кандидаты и сотрудники ---- */
.pk .btn, .staff-item .btn{color:#dfe9ff; border-color:rgba(255,255,255,.16)}
.pk .btn:not(.dis):hover{border-color:color-mix(in srgb, var(--accent) 60%, transparent); color:#fff;
  background:linear-gradient(180deg, color-mix(in srgb, var(--accent) 26%, transparent), color-mix(in srgb, var(--accent) 8%, transparent))}
.pk-meta, .pk .muted.small{font-size:11.5px}

/* ---- итоги дня ---- */
.total-row{
  margin-top:6px; padding:14px 0 2px; border-top:1px solid var(--line-strong);
  font-size:16px; font-weight:750; letter-spacing:-0.02em;
}
.total-row b{font-size:19px; font-variant-numeric:tabular-nums}

/* ---- пауза заметнее ---- */
.spd .i[data-i="pause"]{width:15px; height:15px}

/* ---- отчёт ---- */
.report-grid{gap:10px; margin:14px 0 16px}
.rn{
  background:linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.012));
  border:1px solid var(--line); border-radius:15px; padding:14px 10px;
  box-shadow:0 1px 0 rgba(255,255,255,.06) inset;
}
.rn b{font-size:23px; font-weight:800; letter-spacing:-0.03em; line-height:1.15}
.rn span{font-size:11px; color:var(--muted); letter-spacing:.02em}
.pnl-row{padding:9px 0; border-bottom:1px solid rgba(255,255,255,.05); font-size:13.5px}
.pnl-row b{font-variant-numeric:tabular-nums; font-weight:700}
.pnl-row.total{
  border-top:1px solid var(--line-strong); border-bottom:0; margin-top:8px; padding-top:13px;
  font-size:15px; font-weight:750;
}
.pnl-row.total b{font-size:19px; letter-spacing:-0.02em}
@media (max-width:600px){
  .report-grid{grid-template-columns:repeat(2,1fr)}
  .rn b{font-size:21px}
}

/* ---- вкладки на узком экране: только иконки ---- */
.tab-lbl{white-space:nowrap}
@media (max-width:420px){
  .tab{flex-direction:column; gap:3px; padding:8px 4px; font-size:10.5px; min-height:52px}
  .tab .i{width:18px; height:18px}
  .tab-lbl{display:none}
  .tab-badge{position:absolute; top:3px; right:6px; margin:0; height:15px; min-width:15px; font-size:9.5px}
  .tab{position:relative}
}

/* ---- модалка события / меню ---- */
.modal{
  background:linear-gradient(180deg, #16203a, #0e1626);
  border:1px solid var(--line-strong); border-radius:22px; padding:22px;
  box-shadow:0 40px 90px -40px #000, 0 1px 0 rgba(255,255,255,.08) inset;
}
.modal-bg{background:rgba(4,7,14,.72); backdrop-filter:blur(6px)}

const ROLES = {

const CONTRACTS = [
  { id:'bronze', name:'Бронза',  sla:90, missed:0.08, nps:3.8, brand:0.70, pay:1.00, color:'#a16207' },

  { id:'plat',   name:'Платина', sla:25, missed:0.015,nps:4.6, brand:1.00, pay:1.45, color:'#67e8f9' },
];

const NAMES = ['Игорь','Ольга','Дмитрий','Анна','Сергей','Мария','Алексей','Елена','Павел','Ирина','Ринат','Юлия','Максим','Светлана'];
const TRAITS = [
  { id:'worker',  name:'Трудяга',      speed:1.15, mood:-0.05, desc:'Быстрее, но требует больше' },
  { id:'pedant',  name:'Педант',       speed:0.9,  acc:0.06,    desc:'Аккуратен, но медлит' },
  { id:'soul',    name:'Душа компании',service:0.12, speed:0.97, desc:'Клиенты его любят' },
  { id:'lazy',    name:'Лентяй',       speed:0.82, salary:-250, desc:'Дёшев, но медленный' },
  { id:'grumpy',  name:'Скандалист',   service:-0.06, speed:1.05, desc:'Энергичен, но портит нервы' },
];

/* ---------------- RNG ---------------- */
function rnd(S){ S.rng = (Math.imul(S.rng, 1664525) + 1013904223) >>> 0; return S.rng / 4294967296; }
function rr(S,a,b){ return a + rnd(S)*(b-a); }
function ri(S,a,b){ return Math.floor(rr(S,a,b+1)); }
function pick(S,arr){ return arr[Math.floor(rnd(S)*arr.length)]; }
function chance(S,p){ return rnd(S) < p; }

/* ---------------- accessors ---------------- */
const brandOf    = S => BRANDS.find(b => b.id === S.brandId);
const premOf     = S => PREMISES.find(p => p.id === S.premiseId);
const contractOf = S => CONTRACTS[S.contractIdx];

function compliance(S){
  const req = brandOf(S).req;
  const have = req.filter(id => S.owned[id]).length;
  return have / req.length;
}

function slotsUsed(S){
  let n = 0;
  for (const id in S.owned) if (S.owned[id] > 0 && ITEMS[id].slots) n += ITEMS[id].slots * S.owned[id];
  return n;
}

function capacity(S){
  let n = 0, free = 0;
  for (const sh of S.shelves){ n += sh.cap; free += sh.cells.filter(c => !c).length; }
  return { total:n, free, used:n - free };
}

function zoneOf(pkg){
  if (pkg.size === 'XL') return 'kgt';
  if (pkg.fragile) return 'frag';
  return 'std';
}

function storedPackages(S){
  const out = [];
  for (const sh of S.shelves) sh.cells.forEach((c,i)=>{ if (c) out.push({ ...c, shelfId:sh.id, cellIdx:i }); });
  return out;
}

function findCellByCode(S, code){
  for (const sh of S.shelves){
    for (let i=0;i<sh.cells.length;i++) if (sh.cells[i] && sh.cells[i].code === code) return { shelfId:sh.id, cellIdx:i, pkg:sh.cells[i] };
  }
  return null;
}

/* ---------------- создание игры ---------------- */
function createGame({ brandId, premiseId, seed }){
  const prem = PREMISES.find(p => p.id === premiseId) || PREMISES[1];
  const s0 = (seed == null ? (Date.now() % 1000000000) : seed) >>> 0;
  const S = {
    seed: s0, rng: s0 || 1,
    brandId: brandId || 'plus',
    premiseId: prem.id,
    money: CFG.START_MONEY - prem.deposit,
    day: 1, minutes: 0, phase: 'plan', speed: 1,
    nps: 4.2, xp: 0, lvl: 1,
    fatigue: 0, tiredUntil: -1, player: { busy: null }, hands: null,
    owned: {},
    grid: { w: prem.gw || 8, h: prem.gh || 6 },
    fixtures: [],
    unplaced: [],
    fittingBusy: [],
    shelves: [],
    receiving: [],
    clients: [],
    staff: [],
    candidates: [],
    trucks: [],
    event: null,
    contractIdx: 0,
    debt: 0,
    negDays: 0,
    // статистика дня
    dayStats: null,
    history: [],
    forecast: [],
    kpiWeek: { issued:0, slaSum:0, missed:0, arrivals:0, days:0 },
    log: [],
    aid: 1,
    policies: { placement:'sla', overflow:'block', autoReturn:true },
    report: null,
    over: false, overReason: null,
    tutorialStep: 0,
  };
  S.dayStats = freshDayStats();
  buildCandidates(S);
  S.forecast = forecastFor(S);
  pushLog(S, `Открытие ПВЗ «${brandOf(S).name}» — ${prem.name}. В кассе ${fmt(S.money)} ₽.`, 'info');
  return S;
}

function freshDayStats(){
  return {
    revenue:0, tips:0, fines:0, issued:0, missed:0, consults:0,
    slaSum:0, arrivals:0, accepted:0, payroll:0, rent:0, util:0, tax:0, loan:0, net:0,
    peakQueue:0, mistakes:0, tryon:0, events:0,
  };
}

function fmt(n){ return Math.round(n).toLocaleString('ru-RU'); }

function pushLog(S, text, type='info'){
  S.log.unshift({ text, type, day:S.day, t:S.minutes });
  if (S.log.length > 80) S.log.pop();
}

/* ---------------- магазин / люди ---------------- */
function itemLocked(S, id){
  const it = ITEMS[id];
  if (!it) return true;
  if (it.lvl > S.lvl) return true;
  if (it.once && S.owned[id]) return true;
  return false;
}

function canBuy(S, id){
  const it = ITEMS[id];
  if (!it || itemLocked(S, id)) return false;
  if (S.money < it.cost) return false;
  if (it.physical && S.unplaced.length > 6) return false;   // сначала расставьте купленное
  return true;
}

function buy(S, id){
  if (S.phase !== 'plan') return { ok:false, msg:'Закупки — только в фазе планирования' };
  if (!canBuy(S, id)){
    const it = ITEMS[id];
    if (S.money < it.cost) return { ok:false, msg:'Не хватает денег' };
    if (it.physical && S.unplaced.length > 6) return { ok:false, msg:'Сначала расставьте купленное на плане' };
    return { ok:false, msg:'Недоступно' };
  }
  const it = ITEMS[id];
  S.money -= it.cost;
  S.owned[id] = (S.owned[id] || 0) + 1;
  if (it.physical) S.unplaced.push(id);
  pushLog(S, `Куплено: ${it.name} (−${fmt(it.cost)} ₽)${it.physical ? ' — расставьте на плане' : ''}`, 'buy');
  recalcForecast(S);
  return { ok:true };
}

function hireCost(S, role){
  const r = ROLES[role];
  return (r.onboard || 0) + r.salary * CFG.PREPAY_DAYS;
}
function hireBreakdown(S, role){
  const r = ROLES[role];
  return { onboard: r.onboard || 0, advance: r.salary * CFG.PREPAY_DAYS, total: hireCost(S, role), days: CFG.PREPAY_DAYS };
}

function canHire(S, role){
  if (S.phase !== 'plan') return { ok:false, msg:'Найм — только в фазе планирования' };
  const r = ROLES[role];
  const have = S.staff.filter(s => s.role === role).length;
  if (have >= r.max) return { ok:false, msg:`Максимум ${r.max} на этой роли` };
  if (r.lvl > S.lvl) return { ok:false, msg:`Откроется на уровне ${r.lvl}` };
  const cost = hireCost(S, role);
  if (S.money < cost) return { ok:false, msg:`Нужно ${fmt(cost)} ₽: оформление ${fmt(r.onboard)} + аванс ${fmt(r.salary * CFG.PREPAY_DAYS)} за ${CFG.PREPAY_DAYS} дн.` };
  return { ok:true };
}

function hire(S, role){
  const c = canHire(S, role);
  if (!c.ok) return c;
  if (!S.candidates.length) buildCandidates(S);
  const cand = S.candidates.find(c2 => c2.role === role) || makeCandidate(S, role);
  const cost = hireCost(S, role);
  S.money -= cost;
  S.candidates = S.candidates.filter(c2 => c2.id !== cand.id);
  S.staff.push({ ...cand, id:'e'+(S.aid++), mood:70, fatigue:0, task:null, onShift:true, daysWorked:0, prepay: CFG.PREPAY_DAYS });
  pushLog(S, `Нанят ${ROLES[role].name}: ${cand.name} (${cand.traitName}). Оформление и аванс: −${fmt(cost)} ₽`, 'hire');
  buildCandidates(S);
  return { ok:true };
}

function fire(S, id){
  if (S.phase !== 'plan') return { ok:false, msg:'Увольнять — только в фазе планирования' };
  const st = S.staff.find(s => s.id === id);
  if (!st) return { ok:false, msg:'Нет такого сотрудника' };
  S.staff = S.staff.filter(s => s.id !== id);
  S.nps = clamp(S.nps - 0.02, 0, 5);
  const lost = (st.prepay || 0) * st.salary;
  pushLog(S, `Уволен ${st.name}.${lost > 0 ? ` Неотработанный аванс ${fmt(lost)} ₽ не возвращается.` : ''} Команда нервничает.`, 'bad');
  return { ok:true };
}

function makeCandidate(S, role){
  const tr = pick(S, TRAITS);
  const base = { seller:{sp:5,ac:5,sv:6}, loader:{sp:6,ac:5,sv:3}, manager:{sp:6,ac:6,sv:7} }[role];
  const salary = ROLES[role].salary + (tr.salary || 0) + ri(S,-150,300);
  return {
    id:'c'+(S.aid++), role,
    name: pick(S, NAMES),
    sp: clamp(base.sp + ri(S,-2,2), 1, 10),
    ac: clamp(base.ac + ri(S,-2,2), 1, 10),
    sv: clamp(base.sv + ri(S,-2,2), 1, 10),
    trait: tr.id, traitName: tr.name, traitDesc: tr.desc,
    salary: Math.max(700, Math.round(salary / 50) * 50),
    mood: 70,
  };
}

function buildCandidates(S){
  const need = [];
  for (const role in ROLES){
    const have = S.staff.filter(s => s.role === role).length;
    const want = role === 'manager' ? 1 : 2;
    for (let i = 0; i < Math.max(0, want - have); i++) need.push(role);
  }
  S.candidates = need.map(r => makeCandidate(S, r));
  // перемешаем, чтобы не было сгруппировано
  S.candidates.sort((a,b) => (a.name > b.name ? 1 : -1));
}

/* ---------------- спрос и прогноз ---------------- */
const HOUR_W = [0.6, 0.8, 1.1, 1.5, 1.3, 0.9, 0.8, 1.0, 1.45, 1.6, 1.2, 0.7]; // 09..20

function npsFactor(S){ return 0.65 + clamp(S.nps,0,5) / 5 * 0.70; }

function dayDemand(S){
  const p = premOf(S), b = brandOf(S);
  const dow = (S.day - 1) % 7;
  const dowF = [1.0, 0.95, 0.95, 1.0, 1.1, 1.25, 0.85][dow];  // пн..вс
  const growth = 1 + Math.min(0.45, (S.day - 1) * 0.025);
  let d = 26 * p.traffic * b.traffic * npsFactor(S) * dowF * growth;
  if (S.owned.coffee) d *= ITEMS.coffee.traffic;
  return d;
}

function recalcForecast(S){ S.forecast = forecastFor(S); }

function forecastFor(S){
  const base = dayDemand(S);
  const sumW = HOUR_W.reduce((a,b)=>a+b,0);
  return HOUR_W.map((w,h) => {
    const exp = base * w / sumW;
    return { hour: CFG.START_HOUR + h, exp };
  });
}

/* ---------------- день ---------------- */
function expirePackages(S){
  let n = 0, fee = 0;
  for (const sh of S.shelves){
    for (let i=0;i<sh.cells.length;i++){
      const p = sh.cells[i];
      if (p && p.slaDay <= S.day){
        sh.cells[i] = null; n++;
        fee += 30;
      }
    }
  }
  // просроченное в приёмке тоже уходит
  const before = S.receiving.length;
  S.receiving = S.receiving.filter(p => p.slaDay > S.day);
  n += before - S.receiving.length;
  if (n){
    S.money += fee;
    pushLog(S, `${n} посылок с истёкшим сроком хранения отправлены назад. +${fmt(fee)} ₽ за обработку.`, 'warn');
  }
  return n;
}

function layoutProblems(S){
  const out = [];
  if (!S.fixtures.some(f => f.itemId === 'counter')) out.push('Не поставлена стойка выдачи');
  if (!S.shelves.length) out.push('Нет ни одного стеллажа');
  if (S.unplaced.length) out.push(`Не расставлено предметов: ${S.unplaced.length}`);
  return out;
}

function startDay(S){
  if (S.phase !== 'plan') return;
  const probs = layoutProblems(S);
  if (probs.length) return { ok:false, msg:probs[0] };
  expirePackages(S);
  S.phase = 'day';
  S.minutes = 0;
  S.speed = 1;
  S.tiredUntil = 0;
  if (S.player){ S.player.busy = null; S.player.stand = null; }
  S.hands = null;
  S.fittingBusy = [];
  S.dayStats = freshDayStats();
  S.recalcDone = false;
  S.clients = [];
  S.receiving = S.receiving; // переносим
  S.trucks = [];
  S.event = null;

  const total = Math.max(8, Math.round(dayDemand(S) * 0.95));
  const parts = [0.6, 0.4];
  const times = [25, 390];
  parts.forEach((pct, i) => {
    S.trucks.push({
      arriveAt: times[i],
      boxes: Math.max(2, Math.round(total * pct)),
      left: Math.max(2, Math.round(total * pct)),
      waitLeft: 300,
      arrived: false,
    });
  });

  S.staff.forEach(st => { st.task = null; st.onShift = true; st.fatigue = Math.max(0, st.fatigue - 20); });
  S.forecast = forecastFor(S);
  pushLog(S, `День ${S.day}: открываемся. Прогноз ${Math.round(dayDemand(S))} клиентов.`, 'info');
  scheduleEvents(S);
}

function scheduleEvents(S){
  // 1-2 события за день в случайные моменты
  const n = chance(S, 0.55) ? 2 : 1;
  const times = [];
  for (let i=0;i<n;i++) times.push(ri(S, 60, 640));
  S.eventQueue = times.sort((a,b)=>a-b).map(t => ({ at:t, fired:false }));
}

function stepMinute(S){
  if (S.phase !== 'day' || S.event || S.over) return;
  S.minutes++;

  // задача игрока
  if (S.player && S.player.busy){
    S.player.busy.t--;
    if (S.player.busy.t <= 0) completePlayerTask(S);
  }

  // события
  if (S.eventQueue){
    for (const ev of S.eventQueue){
      if (!ev.fired && S.minutes >= ev.at){ ev.fired = true; triggerEvent(S); break; }
    }
  }

  // поставки
  for (const tr of S.trucks){
    if (!tr.arrived && S.minutes >= tr.arriveAt){
      tr.arrived = true;
      const room = Math.max(0, capacity(S).free - S.receiving.length);
      if (tr.left > room){
        const dropped = tr.left - room;
        tr.left = room;
        if (dropped > 0){
          S.dayStats.fines += fine(S, dropped * 120);
          S.nps = clamp(S.nps - 0.02, 0, 5);
          pushLog(S, `Склад переполнен: ${dropped} посылок не влезли, машина увезла их назад. Штраф.`, 'bad');
        }
      }
      if (tr.left > 0) pushLog(S, `Пришла машина: ${tr.left} посылок. Принимайте!`, 'truck');
      else pushLog(S, 'Машина приехала и уехала: некуда разгружать.', 'bad');
    }
    if (tr.arrived && tr.left > 0){
      tr.waitLeft--;
      if (tr.waitLeft <= 0){
        if (tr.left > 0){
          const pen = fine(S, 300 + tr.left * 50);
          S.nps = clamp(S.nps - 0.03, 0, 5);
          S.dayStats.fines += pen;
          pushLog(S, `Машина уехала. ${tr.left} посылок не принято — штраф ${fmt(pen)} ₽.`, 'bad');
          tr.left = 0;
        }
      }
    }
  }

  // клиенты
  const hour = Math.floor(S.minutes / 60);
  const hw = HOUR_W[Math.min(11, Math.max(0, hour))];
  const sumW = HOUR_W.reduce((a,b)=>a+b,0);
  const perMinute = (dayDemand(S) * hw / sumW) / 60;
  if (chance(S, perMinute)) spawnClient(S);

  // терпение
  for (const c of S.clients) c.patience--;
  const gone = S.clients.filter(c => c.patience <= 0);
  if (gone.length){
    for (const c of gone){
      S.nps = clamp(S.nps - (c.consult ? 0.008 : 0.04), 0, 5);
      if (!c.consult){ S.dayStats.missed++; S.kpiWeek.missed++; }
      pushLog(S, c.consult ? `Клиент ушёл, не дождавшись консультации.` : `Клиент ушёл без заказа ${c.code}.`, 'bad');
    }
    S.clients = S.clients.filter(c => c.patience > 0);
  }
  S.dayStats.peakQueue = Math.max(S.dayStats.peakQueue, S.clients.length);

  if (S.fittingBusy && S.fittingBusy.length) S.fittingBusy = S.fittingBusy.filter(b => b.until > S.minutes);

  // усталость команды
  for (const st of S.staff){
    st.fatigue = Math.min(100, st.fatigue + 0.12);
    st.mood = clamp(st.mood - 0.03 + (S.owned.ac ? 0.01 : 0), 0, 100);
    staffTick(S, st);
  }

  // усталость директора
  if (S.minutes % 30 === 0) S.fatigue = Math.min(100, S.fatigue + 0.4 * (S.owned.coffee ? 0.7 : 1));

  if (S.minutes >= CFG.DAY_MIN) endDay(S);
}

function spawnClient(S){
  const busy = new Set(S.clients.map(c => c.code).filter(Boolean));
  const available = storedPackages(S).filter(p => !busy.has(p.code));
  S.dayStats.arrivals++;
  S.kpiWeek.arrivals++;
  const patienceMax = CFG.PATIENCE_BASE * patienceMult(S) * rr(S, 0.85, 1.15);

  if (available.length && chance(S, 0.88)){
    const pkg = available[ri(S, 0, available.length - 1)];
    const r = rnd(S);
    let type = 'normal', mood = 0;
    if (r > 0.94){ type = 'scandal'; }
    else if (r > 0.78){ type = 'hurry'; }
    S.clients.push({
      id: 'cl' + (S.aid++), code: pkg.code, consult:false, type, tryon: !!pkg.tryon,
      patience: patienceMax * (type === 'hurry' ? 0.6 : type === 'scandal' ? 0.8 : 1),
      maxPatience: patienceMax * (type === 'hurry' ? 0.6 : type === 'scandal' ? 0.8 : 1),
      arrivedAt: S.minutes,
    });
  } else {
    S.clients.push({
      id: 'cl' + (S.aid++), code: null, consult:true, type:'consult',
      patience: patienceMax, maxPatience: patienceMax, arrivedAt: S.minutes,
    });
  }
}

function patienceMult(S){
  let m = 1;
  if (S.owned.sofa)  m *= ITEMS.sofa.patience;
  if (S.owned.ac)    m *= ITEMS.ac.patience;
  if (S.owned.music) m *= ITEMS.music.patience;
  return m;
}

/* ---------------- персонал: ИИ ---------------- */
function staffSpeedMult(S){
  const st = S.staff.find(s => s.role === 'manager' && s.onShift);
  return st ? 1.25 : 1;
}

function searchMinutes(S, st, cellKind){
  const wrong = cellKind && cellKind === 'std';
  let t = CFG.SEARCH_BASE;
  if (S.owned.scanner) t += ITEMS.scanner.search;
  if (S.owned.printer) t += ITEMS.printer.search;
  if (!S.owned.counter) t += 15;
  const skill = st ? (st.sp / 10) : 0.72;
  t = t * (1.35 - skill * 0.55);
  const tr = st && TRAITS.find(x => x.id === st.trait);
  if (tr && tr.speed) t /= tr.speed;
  t /= staffSpeedMult(S);
  if (wrong) t += 6;
  return Math.max(4, Math.round(t * 10) / 10);
}

function staffTick(S, st){
  if (!st.onShift) return;
  if (st.task){
    st.task.t--;
    if (st.task.t <= 0) finishTask(S, st);
    return;
  }
  assignTask(S, st);
}

function assignTask(S, st){
  const busyClients = new Set(S.staff.map(s => s.task && s.task.kind === 'serve' ? s.task.clientId : null).filter(Boolean));
  const busyCells = new Set(S.staff.map(s => s.task && s.task.kind === 'place' ? s.task.pkgId : null).filter(Boolean));

  if (st.role === 'seller'){
    const target = S.clients
      .filter(c => !c.consult && !busyClients.has(c.id))
      .map(c => { const cell = findCellByCode(S, c.code); return cell ? Object.assign({}, c, {_shelfId: cell.shelfId, _cellIdx: cell.cellIdx}) : null; })
      .filter(Boolean)
      .sort((a,b) => a.patience - b.patience)[0];
    if (target){
      const sh = S.shelves.find(x => x.id === target._shelfId);
      const k = sh ? sh.kind : 'std';
      const dur = searchMinutes(S, st, k);
      st.task = { kind:'serve', clientId:target.id, shelfId:target._shelfId, cellIdx:target._cellIdx, t:dur, total:dur };
      return;
    }
  }
  if (st.role === 'loader'){
    const pkg = S.receiving.find(p => !busyCells.has(p.id));
    if (pkg && freeCellFor(S, pkg)){
      const cell = freeCellFor(S, pkg);
      const dur = Math.max(2, 4 - st.sp * 0.2);
      st.task = { kind:'place', pkgId:pkg.id, cell:{ shelfId:cell.shelf.id, idx:cell.idx }, t:dur, total:dur };
      return;
    }
    const tr = S.trucks.find(t => t.arrived && t.left > 0);
    if (tr && S.receiving.length < CFG.RECV_MAX && capacity(S).free > S.receiving.length){
      const durA = Math.max(1.5, 3 - st.sp * 0.15);
      st.task = { kind:'accept', truckId: tr.arriveAt, t:durA, total:durA };
    }
  }
}

function finishTask(S, st){
  const task = st.task; st.task = null;
  if (!task) return;
  if (task.kind === 'serve'){
    const c = S.clients.find(x => x.id === task.clientId);
    if (!c) return;
    const cell = findCellByCode(S, c.code);
    if (!cell) return;
    const sh = S.shelves.find(x => x.id === cell.shelfId);
    if (!sh || !sh.cells[cell.cellIdx]) return;
    const pkg = sh.cells[cell.cellIdx];
    sh.cells[cell.cellIdx] = null;
    issueInternal(S, c, pkg, st);
  }
  if (task.kind === 'place'){
    const pkg = S.receiving.find(p => p.id === task.pkgId);
    if (!pkg) return;
    const target = freeCellFor(S, pkg);
    if (!target) return;
    takeFromReceiving(S, pkg);
    target.shelf.cells[target.idx] = pkg;
    st.mood = clamp(st.mood + 0.05, 0, 100);
  }
  if (task.kind === 'accept'){
    acceptBox(S, true);
  }
}

function freeCellFor(S, pkg){
  const zone = zoneOf(pkg);
  let best = null;
  for (const sh of S.shelves){
    if (sh.kind !== zone) continue;
    for (let i=0;i<sh.cells.length;i++){
      if (!sh.cells[i]){ best = { shelf:sh, idx:i }; break; }
    }
    if (best) break;
  }
  return best;
}

/* ---------------- действия игрока ---------------- */
function acceptBox(S, silent){
  if (S.phase !== 'day') return { ok:false, msg:'Сейчас не рабочий день' };
  const tr = S.trucks.find(t => t.arrived && t.left > 0);
  if (!tr) return { ok:false, msg:'Машины нет' };
  if (S.receiving.length >= CFG.RECV_MAX) return { ok:false, msg:'Зона приёмки переполнена' };
  if (capacity(S).free <= S.receiving.length) return { ok:false, msg:'Нет свободных ячеек на полках' };
  if (tired(S)) return { ok:false, msg:'Вы вымотаны — нужна пауза' };
  if (S.player.busy) return { ok:false, msg:'Вы обслуживаете клиента — сначала закончите' };

  const pkg = makePackage(S);
  S.receiving.push(pkg);
  tr.left--;
  S.dayStats.accepted++;
  spendFatigue(S, 0.8);
  if (!silent) pushLog(S, `Принята посылка ${pkg.code} (${pkg.size}${pkg.fragile?', хрупкое':''})`, 'accept');
  return { ok:true };
}

function makePackage(S){
  const r = rnd(S);
  let size = 'M', fragile = false;
  if (r > 0.965) size = 'XL';
  else if (r > 0.86) size = 'L';
  else if (r > 0.62) size = 'S';
  fragile = chance(S, 0.07);
  return {
    id: 'p' + (S.aid++),
    code: codeGen(S),
    size, fragile,
    tryon: size !== 'XL' && chance(S, 0.25),
    slaDay: S.day + ri(S, 3, 7),
    day: S.day,
  };
}

function codeGen(S){
  const letters = 'АБВГДКМНПРСТЗ';
  const used = new Set(storedPackages(S).map(p => p.code).concat(S.receiving.map(p => p.code)));
  for (let i=0;i<500;i++){
    const c = letters[ri(S,0,letters.length-1)] + '-' + ri(S,1000,9999);
    if (!used.has(c)) return c;
  }
  return 'Я-' + (S.aid++);
}

function takeFromReceiving(S, pkg){
  S.receiving = S.receiving.filter(p => p.id !== pkg.id);
}

function placeBox(S, pkgId, shelfId, cellIdx){
  if (S.phase !== 'day') return { ok:false };
  if (tired(S)) return { ok:false, msg:'Вы вымотаны' };
  if (S.player.busy) return { ok:false, msg:'Вы обслуживаете клиента' };
  const pkg = S.receiving.find(p => p.id === pkgId);
  if (!pkg) return { ok:false, msg:'Посылки нет в приёмке' };
  const sh = S.shelves.find(s => s.id === shelfId);
  if (!sh) return { ok:false };
  const need = zoneOf(pkg);
  if (sh.kind !== need && sh.kind !== 'std') return { ok:false, msg:`Нужна зона «${ZONE_LABEL[need]}» или обычный стеллаж` };
  if (sh.cells[cellIdx]) return { ok:false, msg:'Ячейка занята' };
  takeFromReceiving(S, pkg);
  sh.cells[cellIdx] = pkg;
  spendFatigue(S, 0.8);
  return { ok:true };
}

function sleepTired(S){ /* noop */ }

function tired(S){ return S.minutes < (S.tiredUntil || 0); }

function spendFatigue(S, n){
  S.fatigue = Math.min(100, S.fatigue + n * (S.owned.coffee ? 0.7 : 1));
  if (S.fatigue >= 95){
    S.tiredUntil = S.minutes + 25;
    S.fatigue = 60;
    pushLog(S, 'Вы вымотаны. Присядьте на 25 минут — без вас никто не обслуживает клиентов.', 'bad');
  }
}

/* ---------- адреса ячеек ---------- */
const SHELF_LETTERS = ['А','Б','В','Г','Д','Е','Ж','З'];

function shelfName(S, shelfId){
  const i = S.shelves.findIndex(s => s.id === shelfId);
  return 'Стеллаж ' + (SHELF_LETTERS[i] || '?');
}
function cellAddress(S, shelfId, cellIdx){
  return shelfName(S, shelfId) + ' · ячейка ' + (cellIdx + 1);
}
function clientLocation(S, clientId){
  const c = S.clients.find(x => x.id === clientId);
  if (!c || !c.code) return null;
  const cell = findCellByCode(S, c.code);
  if (!cell) return null;
  return {
    shelfId: cell.shelfId, cellIdx: cell.cellIdx, pkg: cell.pkg,
    address: cellAddress(S, cell.shelfId, cell.cellIdx),
  };
}

/* время дойти до стеллажа зависит от того, насколько он далеко от стойки */
function fetchMinutes(S, shelfId){
  const d = shelfDistance(S, shelfId);
  let t = (d >= 99) ? 12 : 2 + d * 0.45;
  if (S.owned.scanner) t -= 1;
  if (S.fatigue > CFG.DIRTY_TIRED) t += 2;
  t /= staffSpeedMult(S);
  return Math.max(2, Math.round(t));
}
const HANDOVER_MIN = 2;

/* шаг 1: пошли за посылкой */
function startFetch(S, clientId){
  if (S.phase !== 'day') return { ok:false };
  if (tired(S)) return { ok:false, msg:'Вы вымотаны — отдышитесь' };
  if (S.hands) return { ok:false, msg:'Сначала отдайте посылку клиенту' };
  if (S.player.busy) return { ok:false, msg:'Вы уже в пути' };
  const loc = clientLocation(S, clientId);
  if (!loc) return { ok:false, msg:'Этой посылки нет на полке' };
  const t = fetchMinutes(S, loc.shelfId);
  S.player.busy = { kind:'fetch', clientId, shelfId:loc.shelfId, cellIdx:loc.cellIdx, t, total:t };
  return { ok:true, minutes:t, address:loc.address, started:true };
}

/* шаг 2: отдать клиенту */
function giveToClient(S, clientId){
  if (S.phase !== 'day') return { ok:false };
  if (!S.hands) return { ok:false, msg:'В руках нет посылки' };
  if (S.player.busy) return { ok:false, msg:'Вы уже в пути' };
  if (tired(S)) return { ok:false, msg:'Вы вымотаны' };
  const c = S.clients.find(x => x.id === clientId);
  if (!c){
    returnToShelf(S, S.hands);
    S.hands = null;
    return { ok:false, msg:'Клиент ушёл — посылка вернулась на полку' };
  }
  const t = HANDOVER_MIN;
  S.player.busy = { kind:'handover', clientId, t, total:t };
  return { ok:true, minutes:t, started:true };
}

function returnHands(S){
  if (!S.hands) return { ok:false, msg:'Руки пусты' };
  if (S.player.busy) return { ok:false, msg:'Сначала закончите' };
  returnToShelf(S, S.hands);
  S.hands = null;
  return { ok:true };
}

function returnToShelf(S, pkg){
  for (const sh of S.shelves){
    if (sh.kind !== zoneOf(pkg) && sh.kind !== 'std') continue;
    const idx = sh.cells.indexOf(null);
    if (idx >= 0){ sh.cells[idx] = pkg; return true; }
  }
  if (S.receiving.length < CFG.RECV_MAX){ S.receiving.push(pkg); return true; }
  return false;
}

function issueInternal(S, c, pkg, st){
  const sumSla = S.minutes - c.arrivedAt;
  S.dayStats.issued++;
  S.dayStats.slaSum += sumSla;
  S.kpiWeek.issued++;
  S.kpiWeek.slaSum += sumSla;

  const pay = CFG.PAY_BASE * payoutMult(S, pkg);
  let tip = 0;
  if (c.type === 'hurry') tip = 70 * (c.patience / c.maxPatience);
  else tip = 50 * (c.patience / c.maxPatience);
  if (c.type === 'scandal'){
    const mgr = S.staff.find(s => s.role === 'manager' && s.onShift);
    if (!mgr){ S.nps = clamp(S.nps - 0.02, 0, 5); tip = 0; }
  }
  const reward = Math.round(pay + tip);
  S.money += reward;
  S.dayStats.revenue += Math.round(pay);
  S.dayStats.tips += Math.round(tip);

  S.nps = clamp(S.nps + metricNpsDelta(S, sumSla, c), 0, 5);
  addXp(S, 12);

  if (pkg.tryon) handleFitting(S, c, pay, st);

  S.clients = S.clients.filter(x => x.id !== c.id);
  if (st) st.mood = clamp(st.mood + 0.1, 0, 100);
  if (!st) pushLog(S, `Выдан ${pkg.code} за ${Math.round(sumSla)} мин. +${fmt(reward)} ₽`, 'good');
}

/* примерочная: одежду хотят примерить */
function handleFitting(S, c, pay, st){
  const rooms = S.fixtures.filter(f => f.itemId === 'fitting').length;
  const busy = S.fittingBusy.filter(b => b.until > S.minutes).length;
  if (rooms > busy){
    S.fittingBusy.push({ until: S.minutes + 20 });
    S.money += 40;
    S.dayStats.revenue += 40;
    S.dayStats.tryon++;
    S.nps = clamp(S.nps + 0.008, 0, 5);
    if (!st) pushLog(S, 'Клиент ушёл в примерочную (+40 ₽ за услугу)', 'good');
    return;
  }
  S.nps = clamp(S.nps - 0.005, 0, 5);
  if (chance(S, 0.08)){
    const back = Math.round(pay * 0.5);
    S.money -= back;
    S.dayStats.fines += back;
    pushLog(S, `Негде примерить — клиент вернул заказ. −${fmt(back)} ₽`, 'bad');
  } else if (!st){
    pushLog(S, 'Примерить негде — клиент недоволен.', 'warn');
  }
}

function metricNpsDelta(S, sla, c){
  const target = contractOf(S).sla;
  let d = sla <= target * 0.6 ? 0.008 : sla <= target ? 0.003 : sla <= target * 1.6 ? -0.008 : -0.025;
  if (c.type === 'scandal') d -= 0.01;
  return d;
}

function consult(S, clientId){
  if (tired(S)) return { ok:false, msg:'Вы вымотаны' };
  if (S.player.busy) return { ok:false, msg:'Вы обслуживаете клиента' };
  const c = S.clients.find(x => x.id === clientId);
  if (!c || !c.consult) return { ok:false };
  S.clients = S.clients.filter(x => x.id !== c.id);
  S.money += 25;
  S.dayStats.revenue += 25;
  S.dayStats.consults++;
  S.nps = clamp(S.nps + 0.004, 0, 5);
  spendFatigue(S, 1);
  return { ok:true };
}

function playerServiceMinutes(S, cellKind){
  let t = 10;
  if (S.owned.counter) t -= 2;
  if (S.owned.scanner) t -= 2;
  if (S.owned.printer) t -= 1;
  if (cellKind === 'std') t += 5;
  if (S.fatigue > CFG.DIRTY_TIRED) t += 3;
  t /= staffSpeedMult(S);
  return Math.max(4, Math.round(t));
}

function cancelService(S){
  if (!S.player.busy) return { ok:false };
  const c = S.clients.find(x => x.id === S.player.busy.clientId);
  S.player.busy = null;
  if (c) pushLog(S, `Вы прервали обслуживание ${c.code} — клиент ждёт дальше.`, 'warn');
  return { ok:true };
}

function completePlayerTask(S){
  const b = S.player.busy;
  S.player.busy = null;
  if (!b) return;

  if (b.kind === 'fetch'){
    const c = S.clients.find(x => x.id === b.clientId);
    const sh = S.shelves.find(x => x.id === b.shelfId);
    if (!sh || !sh.cells[b.cellIdx]) return;
    const pkg = sh.cells[b.cellIdx];
    if (!c || pkg.code !== c.code) return;
    if (zoneOf(pkg) !== 'std' && sh.kind === 'std' && chance(S, 0.10)){
      const f = fine(S, 700);
      S.dayStats.fines += f;
      S.nps = clamp(S.nps - 0.05, 0, 5);
      sh.cells[b.cellIdx] = null;
      pushLog(S, `По дороге разбилась посылка ${pkg.code}: лежала в общей зоне. −${fmt(f)} ₽`, 'bad');
      return;
    }
    const addr = cellAddress(S, b.shelfId, b.cellIdx);
    sh.cells[b.cellIdx] = null;
    S.hands = pkg;
    const fx = S.fixtures.find(f => f.shelfId === b.shelfId);
    if (fx) S.player.stand = [fx.x + (b.cellIdx % fx.w), fx.y + Math.floor(b.cellIdx / fx.w)];
    spendFatigue(S, 1);
    pushLog(S, `Взяли ${pkg.code} — ${addr}. Несите клиенту.`, 'info');
    return;
  }

  if (b.kind === 'handover'){
    const pkg = S.hands;
    S.hands = null;
    S.player.stand = null;
    const c = S.clients.find(x => x.id === b.clientId);
    if (!c){ if (pkg) returnToShelf(S, pkg); return; }
    spendFatigue(S, 1);
    issueInternal(S, c, pkg, null);
  }
}

function payoutMult(S, pkg){
  const b = brandOf(S), p = premOf(S);
  let m = p.payout * b.payout * (0.70 + 0.30 * compliance(S));
  if (S.owned.terminal) m *= ITEMS.terminal.pay;
  m *= 1 + (S.lvl - 1) * 0.05;
  m *= contractOf(S).pay;
  return m;
}

function fine(S, amount){
  return Math.round(amount * (S.owned.cam ? ITEMS.cam.fines : 1));
}

/* ---------------- планировка зала ---------------- */
function fixtureAt(S, x, y){
  for (const f of S.fixtures) if (x >= f.x && x < f.x + f.w && y >= f.y && y < f.y + f.h) return f;
  return null;
}

function canPlaceAt(S, w, h, x, y){
  if (x < 0 || y < 0 || x + w > S.grid.w || y + h > S.grid.h) return false;
  for (let dy = 0; dy < h; dy++) for (let dx = 0; dx < w; dx++) if (fixtureAt(S, x + dx, y + dy)) return false;
  return true;
}

function freeArea(S){
  let free = 0;
  for (let y = 0; y < S.grid.h; y++) for (let x = 0; x < S.grid.w; x++) if (!fixtureAt(S, x, y)) free++;
  return free;
}

function placeFixture(S, itemId, x, y){
  if (S.phase !== 'plan') return { ok:false, msg:'Планировка доступна до начала дня' };
  const it = ITEMS[itemId];
  if (!it || !it.physical) return { ok:false, msg:'Этот предмет не ставится в зал' };
  const idx = S.unplaced.indexOf(itemId);
  if (idx < 0) return { ok:false, msg:'Нет свободного предмета — сначала купите' };
  const w = it.size.w, h = it.size.h;
  if (!canPlaceAt(S, w, h, x, y)) return { ok:false, msg:'Здесь не помещается' };

  const fid = 'f' + (S.aid++);
  const fx = { id:fid, itemId, x, y, w, h, shelfId:null };
  if (it.cap){
    const sh = { id:'sh' + (S.aid++), kind:it.zone, cap:it.cap, cells:new Array(it.cap).fill(null), fx:fid };
    S.shelves.push(sh);
    fx.shelfId = sh.id;
  }
  S.fixtures.push(fx);
  S.unplaced.splice(idx, 1);
  return { ok:true, id:fid };
}

function canPlaceIgnoring(S, fx, w, h, x, y){
  if (x < 0 || y < 0 || x + w > S.grid.w || y + h > S.grid.h) return false;
  for (let dy = 0; dy < h; dy++) for (let dx = 0; dx < w; dx++){
    const f = fixtureAt(S, x + dx, y + dy);
    if (f && f.id !== fx.id) return false;
  }
  return true;
}

function moveFixture(S, fid, x, y){
  if (S.phase !== 'plan') return { ok:false, msg:'Только до начала дня' };
  const fx = S.fixtures.find(f => f.id === fid);
  if (!fx) return { ok:false, msg:'Нет такого предмета' };
  if (!canPlaceIgnoring(S, fx, fx.w, fx.h, x, y)) return { ok:false, msg:'Здесь занято' };
  fx.x = x; fx.y = y;
  return { ok:true };
}

function removeFixture(S, fid){
  if (S.phase !== 'plan') return { ok:false, msg:'Только до начала дня' };
  const fx = S.fixtures.find(f => f.id === fid);
  if (!fx) return { ok:false, msg:'Нет такого предмета' };
  if (fx.shelfId){
    const sh = S.shelves.find(x => x.id === fx.shelfId);
    if (sh && sh.cells.some(Boolean)) return { ok:false, msg:'На стеллаже есть посылки — сначала выдайте их' };
    S.shelves = S.shelves.filter(x => x.id !== fx.shelfId);
    if (S.owned[fx.itemId]) S.owned[fx.itemId]--;
  } else {
    if (S.owned[fx.itemId]) S.owned[fx.itemId]--;
  }
  S.fixtures = S.fixtures.filter(f => f.id !== fid);
  S.unplaced.push(fx.itemId);
  return { ok:true };
}

function autoLayout(S){
  let placed = 0;
  for (const itemId of [...S.unplaced]){
    const it = ITEMS[itemId];
    let done = false;
    for (let y = 0; y < S.grid.h && !done; y++){
      for (let x = 0; x < S.grid.w && !done; x++){
        if (canPlaceAt(S, it.size.w, it.size.h, x, y)){
          if (placeFixture(S, itemId, x, y).ok){ placed++; done = true; }
        }
      }
    }
    if (!done) break;
  }
  return { ok:true, placed };
}

/* путь по проходам между двумя клетками (мебель непроходима, кроме старта и цели) */
function gridPath(S, from, to){
  if (!from || !to) return [];
  const key = (x, y) => x + ':' + y;
  const blocked = (x, y) => {
    if (x < 0 || y < 0 || x >= S.grid.w || y >= S.grid.h) return true;
    if (x === to[0] && y === to[1]) return false;
    if (x === from[0] && y === from[1]) return false;
    return !!fixtureAt(S, x, y);
  };
  const prev = new Map([[key(from[0], from[1]), null]]);
  const q = [from];
  let head = 0, found = false;
  while (head < q.length){
    const [x, y] = q[head++];
    if (x === to[0] && y === to[1]){ found = true; break; }
    for (const [nx, ny] of [[x+1,y],[x-1,y],[x,y+1],[x,y-1]]){
      const k = key(nx, ny);
      if (prev.has(k) || blocked(nx, ny)) continue;
      prev.set(k, [x, y]);
      q.push([nx, ny]);
    }
  }
  if (!found) return [from, to];
  const out = [];
  let cur = [to[0], to[1]];
  while (cur){ out.push(cur); cur = prev.get(key(cur[0], cur[1])); }
  return out.reverse();
}

/* дверь (разгрузка машины) — низ зала по центру, если свободно */
function doorCell(S){
  const g = S.grid;
  const cx = Math.floor(g.w / 2);
  for (let d = 0; d < g.w; d++){
    for (const x of [cx - d, cx + d]){
      if (x < 0 || x >= g.w) continue;
      for (let y = g.h - 1; y >= 0; y--) if (!fixtureAt(S, x, y)) return [x, y];
    }
  }
  return [0, g.h - 1];
}

function counterCell(S){
  const cf = S.fixtures.find(f => f.itemId === 'counter');
  return cf ? [cf.x, cf.y] : [0, 0];
}

/* путь по проходам от стойки до конкретной ячейки (для анимации) */
function shelfPath(S, shelfId, cellIdx){
  const fx = S.fixtures.find(f => f.shelfId === shelfId);
  if (!fx) return [];
  const tx = fx.x + (cellIdx % fx.w), ty = fx.y + Math.floor(cellIdx / fx.w);
  return gridPath(S, counterCell(S), [tx, ty]);
}

/* где сейчас человечек: [x, y] */
function playerCell(S){
  const p = S.player || {};
  const cf = S.fixtures.find(f => f.itemId === 'counter');
  const home = cf ? [cf.x, cf.y] : [0, 0];
  const b = p.busy;
  if (b && b.kind === 'fetch'){
    const path = shelfPath(S, b.shelfId, b.cellIdx);
    if (path.length < 2) return home;
    const t = 1 - Math.max(0, b.t) / Math.max(1, b.total);
    return path[Math.min(path.length - 1, Math.round(t * (path.length - 1)))];
  }
  if (b && b.kind === 'handover'){
    const stand = p.stand || home;
    const t = 1 - Math.max(0, b.t) / Math.max(1, b.total);
    return [
      Math.round(stand[0] + (home[0] - stand[0]) * t),
      Math.round(stand[1] + (home[1] - stand[1]) * t),
    ];
  }
  if (p.stand) return p.stand;
  return home;
}

/* где сейчас сотрудник: [x, y] */
function staffCell(S, st){
  const home = st.role === 'loader' ? doorCell(S) : counterCell(S);
  const b = st && st.task;
  if (!b) return home;
  const ease = (path, t, total) => {
    if (!path.length) return home;
    const k = 1 - Math.max(0, t) / Math.max(1, total);
    return path[Math.min(path.length - 1, Math.round(k * (path.length - 1)))];
  };
  if (b.kind === 'serve' && b.shelfId != null){
    const fx = S.fixtures.find(f => f.shelfId === b.shelfId);
    if (!fx) return home;
    const target = [fx.x + (b.cellIdx % fx.w), fx.y + Math.floor(b.cellIdx / fx.w)];
    return ease(gridPath(S, counterCell(S), target), b.t, b.total);
  }
  if (b.kind === 'place' && b.cell){
    const fx = S.fixtures.find(f => f.shelfId === b.cell.shelfId);
    if (!fx) return home;
    const target = [fx.x + (b.cell.idx % fx.w), fx.y + Math.floor(b.cell.idx / fx.w)];
    return ease(gridPath(S, doorCell(S), target), b.t, b.total);
  }
  if (b.kind === 'accept') return doorCell(S);
  return home;
}

/* расстояние от стойки до стеллажа по проходам (BFS) */
function shelfDistance(S, shelfId){
  const sh = S.shelves.find(x => x.id === shelfId);
  if (!sh) return 99;
  const cf = S.fixtures.find(f => f.itemId === 'counter');
  const startCells = [];
  if (cf) for (let dy=0; dy<cf.h; dy++) for (let dx=0; dx<cf.w; dx++) startCells.push([cf.x+dx, cf.y+dy]);
  else startCells.push([0,0]);

  const target = new Set();
  const fx = S.fixtures.find(f => f.shelfId === shelfId);
  if (fx) for (let dy=0; dy<fx.h; dy++) for (let dx=0; dx<fx.w; dx++) target.add((fx.x+dx) + ':' + (fx.y+dy));
  else return 99;

  const blocked = (x,y) => {
    if (x < 0 || y < 0 || x >= S.grid.w || y >= S.grid.h) return true;
    const f = fixtureAt(S, x, y);
    if (!f) return false;
    if (fx && f.id === fx.id) return false;
    if (cf && f.id === cf.id) return false;
    return true;
    
  };
  const dist = new Map();
  const q = [];
  for (const [x,y] of startCells){ dist.set(x+':'+y, 0); q.push([x,y,0]); }
  let head = 0;
  while (head < q.length){
    const [x,y,d] = q[head++];
    if (target.has(x+':'+y)) return d;
    if (d > 40) continue;
    for (const [nx,ny] of [[x+1,y],[x-1,y],[x,y+1],[x,y-1]]){
      const k = nx+':'+ny;
      if (dist.has(k) || blocked(nx,ny)) continue;
      dist.set(k, d+1);
      q.push([nx, ny, d+1]);
    }
  }
  return 99;
}

/* ---------------- кредит ---------------- */
function loanLimit(S){ return Math.round(dayDemand(S) * CFG.PAY_BASE * CFG.LOAN_LIMIT_MULT / 1000) * 1000; }

function takeLoan(S, amount){
  if (S.phase !== 'plan') return { ok:false, msg:'Кредит — в фазе планирования' };
  const limit = loanLimit(S) - S.debt;
  amount = Math.min(amount, limit);
  if (amount <= 0) return { ok:false, msg:'Лимит исчерпан' };
  S.debt += amount;
  S.money += amount;
  pushLog(S, `Взят кредит ${fmt(amount)} ₽ под 0.7%/день. Платёж ежедневный.`, 'warn');
  return { ok:true };
}

/* ---------------- уровни ---------------- */
function xpNeed(S){ return Math.round(150 * Math.pow(S.lvl, 1.6)); }

function addXp(S, n){
  S.xp += n;
  while (S.xp >= xpNeed(S)){
    S.xp -= xpNeed(S);
    S.lvl++;
    pushLog(S, `Уровень ${S.lvl}! Открыты новые возможности.`, 'lvl');
  }
}
